buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // This replaces the val newBuildDir declaration and rootProject configuration
    def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
    rootProject.layout.buildDirectory.set(newBuildDir)
    
    // This handles the subprojects configuration
    subprojects {
        def newSubprojectBuildDir = newBuildDir.dir(project.name)
        project.layout.buildDirectory.set(newSubprojectBuildDir)
        
        // Evaluation dependency
        evaluationDependsOn(":app")
    }
}

// Clean task
tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
